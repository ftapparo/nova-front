# Cabeçalhos de segurança, incluídos no server e em CADA location que tem
# add_header próprio: no nginx, um add_header dentro do location descarta
# todos os do server — sem este include, a CSP sumiria nas páginas.
#
# O TLS e o HSTS são terminados pelo túnel Cloudflare, à frente do servidor.
#
# CSP: tudo na própria origem, inclusive a API (/v3, repassada pelo nginx) e
# o WebSocket ('self' cobre ws/wss do mesmo endereço). style-src precisa de
# 'unsafe-inline' porque o Material UI (Emotion) injeta os estilos em
# <style>. img-src aceita data: para a foto do cadastro, que vem em base64.
# O Cloudflare Web Analytics é injetado pela borda.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://cloudflareinsights.com; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
