server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Não anunciar a versão do nginx.
    server_tokens off;

    # Cabeçalhos de segurança. O TLS e o HSTS são terminados pelo
    # túnel Cloudflare, que fica à frente deste servidor.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # connect-src lista as duas APIs durante a migração de domínio
    # (condominionovaresidence → novaresidence). Remover a antiga ao concluir.
    #
    # style-src e font-src liberam o Google Fonts porque o index.html carrega
    # a fonte Barlow de fonts.googleapis.com (CSS) e fonts.gstatic.com (WOFF).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.condominionovaresidence.com https://api.novaresidence.com.br; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Limite de corpo: esta aplicação só serve arquivos estáticos.
    client_max_body_size 1m;

    location = /manifest.json {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
