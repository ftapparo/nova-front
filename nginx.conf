server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Não anunciar a versão do nginx.
    server_tokens off;

    # Cabeçalhos de segurança: ver nginx-security-headers.conf.
    include /etc/nginx/snippets/security-headers.conf;

    client_max_body_size 1m;

    # A v3 da nova-api não tem CORS: o painel fala só com a própria origem e
    # o nginx repassa /v3 para a API na rede nova-network.
    #
    # O nome é resolvido a cada requisição (resolver do Docker + variável no
    # proxy_pass): se a API estiver fora do ar quando o painel subir, o nginx
    # sobe mesmo assim e passa a funcionar quando ela voltar. Sem URI no
    # proxy_pass, o caminho original (/v3/...) vai como chegou.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $nova_api http://nova-api:3031;

    # Tempo real: WebSocket de longa duração (a API manda ping a cada 30 s).
    location ^~ /v3/ws {
        proxy_pass $nova_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # REST da v3. CF-Connecting-IP (IP do visitante, usado nos limites de
    # tentativa da API) segue como veio da borda.
    location ^~ /v3/ {
        proxy_pass $nova_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Busca de placa em fontes externas leva alguns segundos.
        proxy_read_timeout 60s;
    }

    # Arquivos com hash no nome: nunca mudam.
    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Service worker e manifesto: sempre revalidar, para a versão nova chegar.
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Rotas do painel (React Router): tudo que não é arquivo cai no index.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
