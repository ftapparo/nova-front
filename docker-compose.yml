services:
  front:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Injetados no bundle durante o build. Não são segredos — ficam
        # visíveis no JavaScript publicado. Os valores vêm do .env local.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_AUTH_USER: ${VITE_AUTH_USER}
        VITE_AUTH_PASS: ${VITE_AUTH_PASS}
    container_name: nova-front
    ports:
      - "8080:80"
    # env_file removido: no Portainer (stack via Git), o .env nao esta no
    # clone (fica no .gitignore por conter segredos). As variaveis vem do
    # campo "Environment variables" da stack.
    environment:
      NODE_ENV: production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - nova-network

networks:
  nova-network:
    external: true
    name: nova-network
